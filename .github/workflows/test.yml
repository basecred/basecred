name: BaseCred CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Verify Cryptographic Merkle Tree & Keccak
      run: |
        python3 scripts/generate_snapshot.py

    - name: Verify Custom Wallet Processor
      run: |
        python3 scripts/process_custom_wallets.py

    - name: Verify Snapshot Exporter
      run: |
        python3 scripts/export_final_snapshot.py
